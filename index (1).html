<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Плюсграмм 2.0 | Новая Эпоха</title>
    <style>
        :root {
            --bg-cyber: #050512;
            --panel-cyber: rgba(13, 13, 35, 0.65);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --text-main: #e0e0ff;
            --text-muted: #616193;
            --msg-in: rgba(0, 243, 255, 0.08);
            --msg-out: rgba(255, 0, 85, 0.12);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-cyber); color: var(--text-main);
            overflow: hidden; -webkit-tap-highlight-color: transparent;
            transition: opacity 0.5s ease;
        }

        /* 1. АНИМЕ ИНТРО ЭКРАН */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 200; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        .intro-avatar {
            width: 120px; height: 120px; border-radius: 20px;
            box-shadow: 0 0 20px rgba(82, 136, 193, 0.3);
            transition: all 0.5s ease;
        }
        .intro-text {
            margin-top: 25px; font-size: 18px; font-weight: bold;
            color: #fff; text-align: center; max-width: 80%; min-height: 50px;
        }
        /* Эффект разреза катаны */
        .slash-line {
            position: absolute; width: 150%; height: 4px; background: #fff;
            box-shadow: 0 0 20px #00f3ff, 0 0 10px #fff;
            transform: rotate(-35deg) scaleX(0); z-index: 210;
            transform-origin: left;
        }
        @keyframes slashAnim {
            0% { transform: rotate(-35deg) scaleX(0); }
            50% { transform: rotate(-35deg) scaleX(1); }
            100% { transform: rotate(-35deg) scaleX(0); transform-origin: right; }
        }

        /* 2. ЭКРАН АВТОРИЗАЦИИ */
        #auth-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-cyber); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .auth-card {
            background: var(--panel-cyber); padding: 30px; border-radius: 16px;
            width: 85%; max-width: 320px; text-align: center;
            backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }
        .auth-card h2 { margin-top: 0; color: var(--neon-cyan); font-size: 26px; text-transform: uppercase; letter-spacing: 2px; filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        .form-group input, .modal-body input, .modal-body select {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px; color: #fff; box-sizing: border-box; margin-bottom: 15px; outline: none; font-size: 16px;
        }
        .btn-tg {
            width: 100%; padding: 12px; background: transparent; border: 1px solid var(--neon-cyan);
            border-radius: 8px; color: var(--neon-cyan); font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        /* 3. ГЛАВНЫЙ ИНТЕРФЕЙС */
        #tg-layout {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: none; flex-direction: column;
            background: radial-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 0); background-size: 24px 24px;
        }
        .tg-header {
            background: var(--panel-cyber); height: 60px; display: flex; align-items: center; padding: 0 16px; 
            border-bottom: 1px solid rgba(0, 243, 255, 0.15); backdrop-filter: blur(10px); box-sizing: border-box;
        }
        .tg-title { font-size: 20px; font-weight: bold; flex-grow: 1; color: var(--neon-cyan); text-transform: uppercase; filter: drop-shadow(0 0 5px var(--neon-cyan)); }
        .tg-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; margin-bottom: 60px; }

        /* ЭЛЕМЕНТЫ ЧАТОВ */
        .tg-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(0, 243, 255, 0.04); cursor: pointer; }
        .item-avatar {
            width: 46px; height: 46px; border-radius: 50%; margin-right: 14px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #fff; min-width: 46px; border: 1px solid var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }
        .item-details { flex-grow: 1; min-width: 0; }
        .item-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; color: #fff; }
        .item-msg { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-status { font-size: 11px; font-weight: bold; margin-left: auto; }
        .status-online { color: #00ffaa; filter: drop-shadow(0 0 4px #00ffaa); }
        .status-offline { color: var(--text-muted); }

        /* ВКЛАДКА ВИДЕО */
        .video-feed { display: flex; flex-direction: column; gap: 20px; padding: 15px; box-sizing: border-box; }
        .video-card { background: var(--panel-cyber); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 0, 85, 0.15); }
        .video-card video { width: 100%; max-height: 380px; background: #000; object-fit: contain; }
        .video-info { padding: 14px; }

        /* ВКЛАДКА ПРОФИЛЯ С АЧИВКАМИ */
        .profile-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .achievements-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(0,243,255,0.2); border-radius: 12px; padding: 15px; }
        .achievement-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .ach-unlocked { color: #00ffaa; font-weight: bold; }
        .ach-locked { color: var(--text-muted); }

        /* НАВИГАЦИЯ ВНИЗУ */
        .tg-bottom-tabs {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
            background: var(--panel-cyber); display: flex; border-top: 1px solid rgba(0, 243, 255, 0.15); backdrop-filter: blur(10px); z-index: 30;
        }
        .tab-btn { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; font-weight: bold; gap: 4px; text-transform: uppercase; }
        .tab-btn.active { color: var(--neon-cyan); filter: drop-shadow(0 0 5px var(--neon-cyan)); }

        /* КНОПКА ПЛЮСИК */
        .fab {
            position: absolute; bottom: 80px; right: 20px; width: 52px; height: 52px;
            background: transparent; border: 2px solid var(--neon-magenta); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 20; color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        /* ОКНО ЧАТА И ГОЛОСОВЫЕ */
        #chat-window {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg-cyber); z-index: 50; display: flex; flex-direction: column;
            transition: right 0.25s ease-out;
        }
        #chat-window.open { right: 0; }
        .chat-header { background: var(--panel-cyber); height: 60px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid rgba(0, 243, 255, 0.15); }
        .back-btn { font-size: 22px; cursor: pointer; margin-right: 15px; color: var(--neon-cyan); }
        .chat-body { flex-grow: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 15px; }
        .msg.in { background: var(--msg-in); align-self: flex-start; border: 1px solid rgba(0, 243, 255, 0.15); }
        .msg.out { background: var(--msg-out); align-self: flex-end; border: 1px solid rgba(255, 0, 85, 0.2); }
        
        /* Панель ввода с кнопкой микрофона */
        .chat-input-bar { background: var(--panel-cyber); padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(0, 243, 255, 0.15); }
        .chat-input { flex-grow: 1; padding: 10px 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 20px; color: white; outline: none; }
        .voice-btn { font-size: 20px; cursor: pointer; color: var(--neon-cyan); padding: 5px; transition: 0.2s; }
        .voice-btn.recording { color: var(--neon-magenta); animation: pulse 1s infinite; }

        /* МОДАЛКА */
        #create-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 18, 0.8); z-index: 60; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-body { background: #0d0d23; padding: 25px; border-radius: 16px; width: 85%; max-width: 300px; border: 1px solid var(--neon-magenta); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { width: 100%; padding: 12px; background: #201424; border: 1px solid var(--neon-magenta); border-radius: 8px; color: var(--neon-magenta); cursor: pointer; }
        .video-upload-label { display: block; padding: 12px; background: rgba(0,0,0,0.4); border: 1px dashed var(--neon-magenta); border-radius: 8px; text-align: center; cursor: pointer; color: var(--neon-magenta); margin-bottom: 15px; }

        /* УВЕДОМЛЕНИЕ ОБ АЧИВКЕ */
        #achievement-toast {
